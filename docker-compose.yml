services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: luma_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - luma-store-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d luma_store"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  luma-store-db:
